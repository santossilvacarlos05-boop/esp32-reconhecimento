<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle & Acesso ESP32</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 600px; width: 100%; background-color: #1e293b; border-radius: 16px; border: 1px solid #334155; overflow: hidden; }
        
        /* Navegação por Abas */
        .tabs { display: flex; background-color: #0f172a; border-bottom: 1px solid #334155; flex-wrap: wrap; }
        .tab-btn { flex: 1; min-width: 100px; padding: 12px; background: none; border: none; color: #94a3b8; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .tab-btn.active { color: #38bdf8; border-bottom: 3px solid #38bdf8; background-color: #1e293b; }
        
        /* Conteúdo das Abas */
        .tab-content { display: none; padding: 25px; }
        .tab-content.active { display: block; }

        h2 { font-size: 20px; color: #38bdf8; margin-bottom: 15px; }
        label { display: block; margin-top: 10px; font-size: 14px; color: #94a3b8; }
        input { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; }

        /* Container da Câmera */
        .camera-box {
            width: 100%;
            height: 280px;
            background: #0f172a;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Botões */
        .btn { background-color: #0284c7; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%; }
        .btn-motor { background: linear-gradient(135deg, #22c55e, #16a34a); box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
        .btn-motor:hover { background: linear-gradient(135deg, #16a34a, #15803d); }
    </style>
</head>
<body>

<div class="container">
    <!-- Menu das Abas -->
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'motor')">Motor</button>
        <button class="tab-btn" onclick="openTab(event, 'cadastrar')">Cadastrar</button>
        <button class="tab-btn" onclick="openTab(event, 'escanear')">Escaneamento</button>
        <button class="tab-btn" onclick="openTab(event, 'acessos')">Gerenciar</button>
        <button class="tab-btn" onclick="openTab(event, 'config')">Config IP</button>
    </div>

    <!-- Aba 1: Motor / Acionamento -->
    <div id="motor" class="tab-content active">
        <h2>Controle Manual do Motor</h2>
        <p style="color: #94a3b8; margin-bottom: 15px;">Acionamento do relé (GPIO 4) por 2 segundos:</p>
        <button class="btn btn-motor" onclick="acionarMotor()">LIGAR MOTOR (2s)</button>
    </div>

    <!-- Aba 2: Cadastrar Rostos Permitidos -->
    <div id="cadastrar" class="tab-content">
        <h2>Cadastrar Rostos Permitidos</h2>
        <label>Nome do Usuário:</label>
        <input type="text" placeholder="Digite o nome completo">
        
        <div class="camera-box">
            <video id="videoCadastrar" autoplay playsinline muted></video>
        </div>
        
        <button class="btn" onclick="iniciarCam('videoCadastrar')">Abrir Câmera</button>
        <button class="btn" style="background-color: #16a34a;" onclick="alert('Rosto capturado com sucesso!')">Capturar e Salvar Rosto</button>
    </div>

    <!-- Aba 3: Escaneamento -->
    <div id="escanear" class="tab-content">
        <h2>Escaneamento Facial</h2>
        <p style="color: #94a3b8;">Aproxime-se da câmera para identificação automatizada.</p>
        
        <div class="camera-box">
            <video id="videoEscanear" autoplay playsinline muted></video>
        </div>
        
        <button class="btn" onclick="iniciarCam('videoEscanear')">Ativar Escanear</button>
    </div>

    <!-- Aba 4: Gerenciar Acessos -->
    <div id="acessos" class="tab-content">
        <h2>Gerenciar Acessos</h2>
        <p style="color: #94a3b8;">Lista de rostos cadastrados e permissões do sistema.</p>
    </div>

    <!-- Aba 5: Inserir IP do ESP32 Manualmente -->
    <div id="config" class="tab-content">
        <h2>Configuração de IP</h2>
        <label>Endereço IP do ESP32:</label>
        <input type="text" id="ipInput" placeholder="Ex: 192.168.1.15">
        <button class="btn" onclick="salvarIP()">Salvar IP</button>
    </div>
</div>

<script>
    let streamAtual = null;

    function openTab(evt, tabId) {
        let contents = document.querySelectorAll('.tab-content');
        let buttons = document.querySelectorAll('.tab-btn');
        
        contents.forEach(content => content.classList.remove('active'));
        buttons.forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');

        // Para a câmera ao mudar de aba para economizar recursos
        pararCam();
    }

    // Função para abrir a câmera do celular/computador
    async function iniciarCam(elementId) {
        pararCam();
        try {
            streamAtual = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            let videoElement = document.getElementById(elementId);
            videoElement.srcObject = streamAtual;
        } catch (err) {
            alert("Erro ao acessar a câmera: " + err.message + "\nCertifique-se de que deu permissão de câmera no navegador.");
        }
    }

    // Função para desligar a câmera ao trocar de aba
    function pararCam() {
        if (streamAtual) {
            streamAtual.getTracks().forEach(track => track.stop());
            streamAtual = null;
        }
    }

    // Função para acionar o motor pelo IP configurado ou direto na rede
    function acionarMotor() {
        let ip = localStorage.getItem('esp32_ip');
        let url = ip ? 'http://' + ip + '/acionar' : '/acionar';
        
        fetch(url)
            .then(() => alert('Motor Acionado por 2 segundos!'))
            .catch(() => alert('Erro ao se comunicar com o ESP32. Verifique o IP configurado.'));
    }

    function salvarIP() {
        let ip = document.getElementById('ipInput').value.trim();
        if(ip) {
            localStorage.setItem('esp32_ip', ip);
            alert('IP ' + ip + ' salvo com sucesso!');
        }
    }

    // Carrega o IP salvo no input se existir
    window.onload = function() {
        let ipSalvo = localStorage.getItem('esp32_ip');
        if(ipSalvo) {
            document.getElementById('ipInput').value = ipSalvo;
        }
    }
</script>

</body>
</html>
