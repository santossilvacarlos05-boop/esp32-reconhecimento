<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Configuração para ajustar a tela perfeitamente no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controle de Acesso</title>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f12; 
      color: #f1f1f1; 
      margin: 0; 
      padding: 16px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh;
    }
    
    h1 { 
      color: #00e676; 
      font-size: 1.4rem; 
      margin: 10px 0 16px 0; 
      text-align: center; 
      font-weight: 700;
    }
    
    /* Abas no estilo App Móvel */
    .tabs { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 8px; 
      width: 100%; 
      max-width: 480px; 
      margin-bottom: 16px; 
    }
    .tab-btn { 
      background: #1a1a20; 
      color: #aaa; 
      border: 1px solid #2a2a32; 
      padding: 12px 8px; 
      cursor: pointer; 
      border-radius: 10px; 
      font-weight: 600; 
      font-size: 0.85rem;
      text-align: center;
      transition: all 0.2s;
    }
    .tab-btn.active { 
      background: #00e676; 
      color: #000; 
      border-color: #00e676; 
      font-weight: 700;
    }
    
    .tab-content { 
      display: none; 
      width: 100%; 
      max-width: 480px; 
      flex-direction: column; 
      align-items: center; 
    }
    .tab-content.active { display: flex; }

    /* Exibição da Câmera responsiva */
    .video-container { 
      position: relative; 
      width: 100%; 
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 2px solid #2a2a32;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    video { 
      width: 100%; 
      height: auto; 
      display: block; 
      object-fit: cover;
    }

    /* Caixa de Status do Alerta */
    .status-box { 
      margin-bottom: 12px; 
      font-size: 0.95rem; 
      font-weight: 600; 
      padding: 14px; 
      border-radius: 12px; 
      background: #1a1a20; 
      text-align: center; 
      width: 100%; 
      border: 1px solid #2a2a32;
    }
    .autorizado { color: #00e676; border: 2px solid #00e676; background: #002910; }
    .negado { color: #ff5252; border: 2px solid #ff5252; background: #290000; }

    /* Cards e Formulários */
    .card { 
      background: #1a1a20; 
      padding: 16px; 
      border-radius: 16px; 
      width: 100%; 
      border: 1px solid #2a2a32;
      margin-bottom: 16px;
    }
    .card h3 {
      margin-top: 0;
      font-size: 1.1rem;
      color: #00e676;
    }
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    label { font-size: 0.9rem; color: #ccc; }
    input[type="text"] { 
      padding: 14px; 
      border-radius: 10px; 
      border: 1px solid #3a3a45; 
      background: #0f0f12; 
      color: #fff; 
      font-size: 1rem; 
      width: 100%;
    }
    
    /* Botões Grandes para Toque */
    .btn-action { 
      background: #00e676; 
      color: #000; 
      font-weight: 700; 
      padding: 16px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-size: 1rem; 
      width: 100%; 
      margin-top: 8px;
    }
    
    /* Lista de Usuários */
    .user-list { list-style: none; padding: 0; margin: 0; width: 100%; }
    .user-item { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      background: #0f0f12; 
      padding: 12px; 
      border-radius: 12px; 
      margin-bottom: 8px; 
      border: 1px solid #2a2a32;
    }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-thumb { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid #00e676; }
    .btn-delete { background: transparent; border: none; color: #ff5252; cursor: pointer; font-size: 1.4rem; padding: 8px; }
  </style>
</head>
<body>

  <h1>Controle de Acesso</h1>

  <!-- ABAS (DISPOSTAS EM GRADE 2x2 NO CELULAR) -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('reconhecimentoTab', this)">Escaneamento</button>
    <button class="tab-btn" onclick="switchTab('cadastroTab', this)">Cadastrar</button>
    <button class="tab-btn" onclick="switchTab('gerenciarTab', this)">Gerenciar</button>
    <button class="tab-btn" onclick="switchTab('configTab', this)">Config IP</button>
  </div>

  <!-- ABA 1: ESCANEAMENTO AUTOMÁTICO -->
  <div id="reconhecimentoTab" class="tab-content active">
    <div id="statusScan" class="status-box">Iniciando IA...</div>
    <div class="video-container">
      <video id="videoScan" autoplay playsinline muted></video>
    </div>
  </div>

  <!-- ABA 2: CADASTRAR RUSTO -->
  <div id="cadastroTab" class="tab-content">
    <div class="card">
      <div class="form-group">
        <label>Nome do Usuário:</label>
        <input type="text" id="userName" placeholder="Ex: Maria Souza">
      </div>
      <div class="video-container" style="margin-bottom: 12px;">
        <video id="videoCadastro" autoplay playsinline muted></video>
      </div>
      <button class="btn-action" onclick="capturarECadastrar()">📸 Capturar e Cadastrar</button>
    </div>
  </div>

  <!-- ABA 3: GERENCIAR ACESSOS -->
  <div id="gerenciarTab" class="tab-content">
    <div class="card">
      <h3>Usuários Permitidos</h3>
      <ul id="userList" class="user-list"></ul>
    </div>
  </div>

  <!-- ABA 4: CONFIGURAÇÃO DE IP -->
  <div id="configTab" class="tab-content">
    <div class="card">
      <h3>Configuração da Rede</h3>
      <div class="form-group">
        <label>IP do ESP32:</label>
        <input type="text" id="esp32IpInput" placeholder="Ex: 192.168.77.33">
      </div>
      <button class="btn-action" onclick="salvarIP()">Salvar IP</button>
    </div>
  </div>

  <script>
    let esp32Ip = localStorage.getItem('esp32_ip') || "192.168.77.33";
    let streamCamera = null;
    let faceMatcher = null;
    let podeAcionar = true;
    let intervalScan = null;

    const videoScan = document.getElementById('videoScan');
    const videoCadastro = document.getElementById('videoCadastro');
    const statusScan = document.getElementById('statusScan');

    document.getElementById('esp32IpInput').value = esp32Ip;

    Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),
      faceapi.nets.faceLandmark64Net.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),
      faceapi.nets.faceRecognitionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),
      faceapi.nets.ssdMobilenetv1.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models')
    ]).then(() => {
      atualizarListaEModelos();
      abrirCamera(videoScan, true);
    });

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      pararCameras();

      if (tabId === 'reconhecimentoTab') {
        abrirCamera(videoScan, true);
      } else if (tabId === 'cadastroTab') {
        abrirCamera(videoCadastro, false);
      }
    }

    function abrirCamera(elementoVideo, ativarScan) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
          streamCamera = stream;
          elementoVideo.srcObject = stream;
          if (ativarScan) iniciarLoopScan();
        })
        .catch(() => alert("Erro ao acessar a câmera. Verifique as permissões!"));
    }

    function pararCameras() {
      if (intervalScan) clearInterval(intervalScan);
      if (streamCamera) {
        streamCamera.getTracks().forEach(track => track.stop());
      }
    }

    function iniciarLoopScan() {
      intervalScan = setInterval(async () => {
        if (!faceMatcher) {
          statusScan.innerText = "Nenhum rosto cadastrado.";
          statusScan.className = "status-box";
          return;
        }

        const deteccoes = await faceapi.detectAllFaces(videoScan).withFaceLandmarks().withFaceDescriptors();

        if (deteccoes.length === 0) {
          statusScan.innerText = "Procurando rosto...";
          statusScan.className = "status-box";
          return;
        }

        const resultados = deteccoes.map(d => faceMatcher.findBestMatch(d.descriptor));

        resultados.forEach(res => {
          if (res.label !== 'unknown' && podeAcionar) {
            statusScan.innerText = `✅ ACESSO PERMITIDO: ${res.label}`;
            statusScan.className = "status-box autorizado";
            acionarRele();
          } else if (res.label === 'unknown') {
            statusScan.innerText = "🚨 ALERTA: Rosto NÃO cadastrado!";
            statusScan.className = "status-box negado";
          }
        });
      }, 1000);
    }

    async function capturarECadastrar() {
      const nomeInput = document.getElementById('userName');
      if (!nomeInput.value.trim()) {
        alert("Digite o nome do usuário!");
        return;
      }

      const canvas = document.createElement('canvas');
      canvas.width = videoCadastro.videoWidth;
      canvas.height = videoCadastro.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoCadastro, 0, 0, canvas.width, canvas.height);
      const fotoBase64 = canvas.toDataURL('image/jpeg');

      const img = await faceapi.fetchImage(fotoBase64);
      const deteccao = await faceapi.detectSingleFace(img);

      if (!deteccao) {
        alert("Nenhum rosto detectado! Fique de frente para a câmera.");
        return;
      }

      const usuarios = JSON.parse(localStorage.getItem('esp32_usuarios') || '[]');
      usuarios.push({ nome: nomeInput.value.trim(), fotoBase64: fotoBase64 });
      localStorage.setItem('esp32_usuarios', JSON.stringify(usuarios));

      nomeInput.value = '';
      alert("Rosto cadastrado com sucesso!");
      atualizarListaEModelos();
      switchTab('gerenciarTab', document.querySelectorAll('.tab-btn')[2]);
    }

    async function atualizarListaEModelos() {
      const usuarios = JSON.parse(localStorage.getItem('esp32_usuarios') || '[]');
      const userListElement = document.getElementById('userList');
      userListElement.innerHTML = '';

      if (usuarios.length === 0) {
        userListElement.innerHTML = '<p style="color:#aaa; text-align:center;">Nenhum usuário cadastrado.</p>';
        faceMatcher = null;
        return;
      }

      const labeledDescriptors = [];

      for (let index = 0; index < usuarios.length; index++) {
        const u = usuarios[index];

        const li = document.createElement('li');
        li.className = 'user-item';
        li.innerHTML = `
          <div class="user-info">
            <img src="${u.fotoBase64}" class="user-thumb">
            <span>${u.nome}</span>
          </div>
          <button class="btn-delete" onclick="deletarUsuario(${index})" title="Excluir Permissão">🗑️</button>
        `;
        userListElement.appendChild(li);

        const img = await faceapi.fetchImage(u.fotoBase64);
        const deteccao = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
        if (deteccao) {
          labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(u.nome, [deteccao.descriptor]));
        }
      }

      if (labeledDescriptors.length > 0) {
        faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.45);
      }
    }

    function deletarUsuario(index) {
      if (confirm("Deseja remover este acesso?")) {
        const usuarios = JSON.parse(localStorage.getItem('esp32_usuarios') || '[]');
        usuarios.splice(index, 1);
        localStorage.setItem('esp32_usuarios', JSON.stringify(usuarios));
        atualizarListaEModelos();
      }
    }

    function salvarIP() {
      const ipInput = document.getElementById('esp32IpInput').value.trim();
      if (!ipInput) {
        alert("Digite um IP válido!");
        return;
      }
      esp32Ip = ipInput;
      localStorage.setItem('esp32_ip', esp32Ip);
      alert(`IP atualizado para: ${esp32Ip}`);
    }

    function acionarRele() {
      podeAcionar = false;
      const url = `http://${esp32Ip}/abrir`;

      fetch(url)
        .then(() => console.log("Comando enviado ao ESP32!"))
        .catch(err => console.error("Erro de conexão com o ESP32:", err));

      setTimeout(() => { podeAcionar = true; }, 5000);
    }
  </script>
</body>
</html>
