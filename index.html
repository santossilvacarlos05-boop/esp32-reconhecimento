<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - ESP32</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .btn-motor {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .btn-motor:hover {
            background: linear-gradient(135deg, #16a34a, #15803d);
            transform: translateY(-2px);
        }

        .btn-motor:active {
            transform: translateY(1px);
            box-shadow: none;
        }

        .status {
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Controle do Motor</h1>
        <p>Acionamento via ESP32 (GPIO 4)</p>
        
        <!-- Botão chamando a rota de 2 segundos -->
        <a href="/acionar" style="text-decoration: none;">
            <button class="btn-motor">LIGAR MOTOR (2s)</button>
        </a>

        <div class="status">Pino ativo: D4 (GPIO 4)</div>
    </div>

</body>
</html>
