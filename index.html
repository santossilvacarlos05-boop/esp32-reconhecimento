<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controle de Acesso</title>
  
  <!-- MediaPipe Face Mesh e Camera Utils (Mais leve e rápido para celulares) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f12; color: #f1f1f1; margin: 0; padding: 16px; 
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    h1 { color: #00e676; font-size: 1.4rem; margin: 10px 0 16px 0; text-align: center; font-weight: 700; }
    
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; max-width: 480px; margin-bottom: 16px; }
    .tab-btn { 
      background: #1a1a20; color: #aaa; border: 1px solid #2a2a32; padding: 12px 8px; 
      cursor: pointer; border-radius: 10px; font-weight: 600; font-size: 0.85rem; text-align: center;
    }
    .tab-btn.active { background: #00e676; color: #000; border-color: #00e676; font-weight: 700; }
    
    .tab-content { display: none; width: 100%; max-width: 480px; flex-direction: column; align-items: center; }
    .tab-content.active { display: flex; }

    .video-container { 
      position: relative; width: 100%; border-radius: 16px; overflow: hidden;
      background: #000; border: 2px solid #2a2a32; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      margin-bottom: 12px;
    }
    video { width: 100%; height: auto; display: block; object-fit: cover; }

    .status-box { 
      margin-bottom: 12px; font-size: 0.95rem; font-weight: 600; padding: 14px; 
      border-radius: 12px; background: #1a1a20; text-align: center; width: 100%; border: 1px solid #2a2a32;
      min-height: 50px; display: flex; align-items: center; justify-content: center;
    }
    .autorizado { color: #00e676; border: 2px solid #00e676; background: #002910; }
    .negado { color: #ff5252; border: 2px solid #ff5252; background: #290000; }

    .card { background: #1a1a20; padding: 16px; border-radius: 16px; width: 100%; border: 1px solid #2a2a32; margin-bottom: 16px; }
    .card h3 { margin-top: 0; font-size: 1.1rem; color: #00e676; }
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    label { font-size: 0.9rem; color: #ccc; }
    input[type="text"] { 
      padding: 14px; border-radius: 10px; border: 1px solid #3a3a45; 
      background: #0f0f12; color: #fff; font-size: 1rem; width: 100%;
    }
    
    .btn-action { 
      background: #00e676; color: #000; font-weight: 700; padding: 16px; 
      border: none; border-radius: 12px; cursor: pointer; font-size: 1rem; width: 100%; margin-top: 8px;
    }
    .btn-action:disabled { background: #444; color: #888; cursor: not-allowed; }

    .user-list { list-style: none; padding: 0; margin: 0; width: 100%; }
    .user-item { 
      display: flex; align-items: center; justify-content: space-between; 
      background: #0f0f12; padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #2a2a32;
    }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-thumb { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid #00e676; }
    .btn-delete { background: transparent; border: none; color: #ff5252; cursor: pointer; font-size: 1.4rem; padding: 8px; }
  </style>
</head>
<body>

  <h1>Controle de Acesso</h1>

  <div class="tabs">
    <button id="btnTab1" class="tab-btn active" onclick="switchTab('reconhecimentoTab', this)">Escaneamento</button>
    <button id="btnTab2" class="tab-btn" onclick="switchTab('cadastroTab', this)">Cadastrar</button>
    <button id="btnTab3" class="tab-btn" onclick="switchTab('gerenciarTab', this)">Gerenciar</button>
    <button id="btnTab4" class="tab-btn" onclick="switchTab('configTab', this)">Config IP</button>
  </div>

  <div id="reconhecimentoTab" class="tab-content active">
    <div id="statusScan" class="status-box">Aguardando câmera...</div>
    <div class="video-container">
      <video id="videoScan" autoplay playsinline muted></video>
    </div>
    <!-- Novo botão para verificação manual -->
    <button id="btnVerificar" class="btn-action" onclick="realizarVerificacaoManual()">🔍 Verificar Identidade</button>
  </div>

  <div id="cadastroTab" class="tab-content">
    <div class="card">
      <div class="form-group">
        <label>Nome do Usuário:</label>
        <input type="text" id="userName" placeholder="Ex: Maria Souza">
      </div>
      <div class="video-container">
        <video id="videoCadastro" autoplay playsinline muted></video>
      </div>
      <button id="btnCadastrar" class="btn-action" onclick="capturarECadastrar()">📸 Capturar Foto e Cadastrar</button>
    </div>
  </div>

  <div id="gerenciarTab" class="tab-content">
    <div class="card">
      <h3>Usuários Permitidos</h3>
      <ul id="userList" class="user-list"></ul>
    </div>
  </div>

  <div id="configTab" class="tab-content">
    <div class="card">
      <h3>Configuração da Rede</h3>
      <div class="form-group">
        <label>IP do ESP32:</label>
        <input type="text" id="esp32IpInput" placeholder="Ex: 192.168.77.33">
      </div>
      <button class="btn-action" onclick="salvarIP()">Salvar IP</button>
    </div>
  </div>

  <script>
    let esp32Ip = localStorage.getItem('esp32_ip') || "192.168.77.33";
    let videoStream = null;
    let faceMesh = null;
    let cameraUtil = null;
    let ultimoLandmarks = null;
    let podeAcionar = true;
    let abaAtual = 'reconhecimentoTab';

    document.getElementById('esp32IpInput').value = esp32Ip;

    // Inicialização da IA do Google
    async function initIA() {
      const statusScan = document.getElementById('statusScan');
      statusScan.innerText = "Carregando Inteligência Artificial...";
      
      faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults(onResults);
      iniciarCamera(document.getElementById('videoScan'));
    }

    function switchTab(tabId, btn) {
      abaAtual = tabId;
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      const statusScan = document.getElementById('statusScan');
      statusScan.innerText = "Aguardando verificação...";
      statusScan.className = "status-box";

      if (tabId === 'reconhecimentoTab') {
        iniciarCamera(document.getElementById('videoScan'));
      } else if (tabId === 'cadastroTab') {
        iniciarCamera(document.getElementById('videoCadastro'));
      } else if (tabId === 'gerenciarTab') {
        pararCamera();
        atualizarLista();
      } else {
        pararCamera();
      }
    }

    function iniciarCamera(videoElement) {
      pararCamera();
      
      cameraUtil = new Camera(videoElement, {
        onFrame: async () => {
          if (abaAtual === 'reconhecimentoTab' || abaAtual === 'cadastroTab') {
            await faceMesh.send({ image: videoElement });
          }
        },
        width: 640,
        height: 480
      });
      cameraUtil.start();
      
      if(abaAtual === 'reconhecimentoTab'){
        document.getElementById('statusScan').innerText = "Câmera pronta. Posicione o rosto e clique no botão.";
      }
    }

    function pararCamera() {
      if (cameraUtil) {
        cameraUtil.stop();
        cameraUtil = null;
      }
    }

    function onResults(results) {
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        ultimoLandmarks = null;
        return;
      }
      ultimoLandmarks = results.multiFaceLandmarks[0];
    }

    function realizarVerificacaoManual() {
      const statusScan = document.getElementById('statusScan');
      const btnVerificar = document.getElementById('btnVerificar');
      const usuarios = JSON.parse(localStorage.getItem('esp32_usuarios') || '[]');

      if (usuarios.length === 0) {
        statusScan.innerText = "⚠️ Nenhum rosto cadastrado no sistema.";
        statusScan.className = "status-box negado";
        return;
      }

      if (!ultimoLandmarks) {
        statusScan.innerText = "❓ Rosto não detectado. Aproxime-se da câmera.";
        statusScan.className = "status-box negado";
        return;
      }

      btnVerificar.disabled = true;
      btnVerificar.innerText = "⏳ Verificando...";

      let melhorMatch = null;
      let menorDistancia = 999;

      // Pontos chave para comparação rápida e precisa
      const pontosChave = [1, 33, 263, 61, 291, 199, 10, 152];

      for (let u of usuarios) {
        if (!u.landmarks) continue;
        
        let soma = 0;
        for (let idx of pontosChave) {
          const dx = ultimoLandmarks[idx].x - u.landmarks[idx].x;
          const dy = ultimoLandmarks[idx].y - u.landmarks[idx].y;
          soma += Math.sqrt(dx * dx + dy * dy);
        }
        const dist = soma / pontosChave.length;

        if (dist < menorDistancia) {
          menorDistancia = dist;
          melhorMatch = u.nome;
        }
      }

      // Limiar de aceitação (menor é mais rigoroso)
      if (menorDistancia < 0.07 && melhorMatch) {
        statusScan.innerText = `✅ ACESSO PERMITIDO: ${melhorMatch}`;
        statusScan.className = "status-box autorizado";
        acionarRele();
      } else {
        statusScan.innerText = "🚨 ALERTA: Rosto NÃO cadastrado!";
        statusScan.className = "status-box negado";
      }

      // Reseta o botão e o status após 3 segundos
      setTimeout(() => {
        btnVerificar.disabled = false;
        btnVerificar.innerText = "🔍 Verificar Identidade";
        statusScan.innerText = "Câmera pronta. Posicione o rosto e clique no botão.";
        statusScan.className = "status-box";
      }, 3000);
    }

    function capturarECadastrar() {
      const nomeInput = document.getElementById('userName');
      const nome = nomeInput.value.trim();

      if (!nome) {
        alert("Por favor, digite o nome do usuário!");
        return;
      }

      if (!ultimoLandmarks) {
        alert("Nenhum rosto detectado na câmera! Posicione-se em um local iluminado.");
        return;
      }

      const video = document.getElementById('videoCadastro');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 320;
      canvas.height = video.videoHeight || 240;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const fotoBase64 = canvas.toDataURL('image/jpeg', 0.7);

      const usuarios = JSON.parse(localStorage.getItem('esp32_usuarios') || '[]');
      usuarios.push({
        nome: nome,
        fotoBase64: fotoBase64,
        landmarks: ultimoLandmarks
      });

      localStorage.setItem('esp32_usuarios', JSON.stringify(usuarios));

      nomeInput.value = '';
      alert(`Rosto de "${nome}" cadastrado com sucesso!`);
      switchTab('gerenciarTab', document.getElementById('btnTab3'));
    }

    function atualizarLista() {
      const usuarios = JSON.parse(localStorage.getItem('esp32_usuarios') || '[]');
      const userListElement = document.getElementById('userList');
      userListElement.innerHTML = '';

      if (usuarios.length === 0) {
        userListElement.innerHTML = '<p style="color:#aaa; text-align:center;">Nenhum usuário cadastrado.</p>';
        return;
      }

      usuarios.forEach((u, index) => {
        const li = document.createElement('li');
        li.className = 'user-item';
        li.innerHTML = `
          <div class="user-info">
            <img src="${u.fotoBase64}" class="user-thumb">
            <span>${u.nome}</span>
          </div>
          <button class="btn-delete" onclick="deletarUsuario(${index})">🗑️</button>
        `;
        userListElement.appendChild(li);
      });
    }

    function deletarUsuario(index) {
      if (confirm("Deseja apagar este usuário?")) {
        const usuarios = JSON.parse(localStorage.getItem('esp32_usuarios') || '[]');
        usuarios.splice(index, 1);
        localStorage.setItem('esp32_usuarios', JSON.stringify(usuarios));
        atualizarLista();
      }
    }

    function salvarIP() {
      const ip = document.getElementById('esp32IpInput').value.trim();
      if (!ip) return alert("Digite um IP válido!");
      esp32Ip = ip;
      localStorage.setItem('esp32_ip', esp32Ip);
      alert("IP salvo com sucesso!");
    }

    function acionarRele() {
      fetch(`http://${esp32Ip}/abrir`).catch(() => {});
    }

    window.onload = initIA;
  </script>
</body>
</html>
