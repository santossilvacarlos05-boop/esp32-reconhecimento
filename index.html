<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Reconhecimento Facial Otimizado</title>
  <!-- Carrega a biblioteca face-api.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; }
    .container { position: relative; display: inline-block; margin-top: 20px; }
    video, canvas { border-radius: 8px; width: 640px; height: 480px; }
    canvas { position: absolute; top: 0; left: 0; }
    #status { font-size: 18px; margin-top: 10px; color: #00ffcc; }
  </style>
</head>
<body>

  <h2>Leitura Facial Rápida (Sem Travamentos)</h2>
  <div id="status">Carregando modelos leves...</div>

  <div class="container">
    <!-- Câmera em resolução reduzida (640x480) para economizar CPU -->
    <video id="webcam" autoplay muted width="640" height="480"></video>
    <canvas id="overlay"></canvas>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const statusText = document.getElementById('status');
    const overlay = document.getElementById('overlay');

    // 1. Inicia a câmera do usuário
    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480, frameRate: { ideal: 30 } },
        audio: false
      });
      video.srcObject = stream;
      return new Promise((resolve) => {
        video.onloadedmetadata = () => resolve(video);
      });
    }

    // 2. Carrega apenas os modelos ultra-leves (Tiny Models)
    async function loadModels() {
      // Baixe os arquivos da pasta 'models' do repositório do face-api.js e coloque em '/models'
      const MODEL_URL = './models'; 
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
    }

    // 3. Loop de detecção otimizado com Throttle
    async function startDetection() {
      const displaySize = { width: video.width, height: video.height };
      faceapi.matchDimensions(overlay, displaySize);

      statusText.innerText = "Analisando rosto...";

      // Configuração para usar o detector leve com resolução interna baixa
      const detectorOptions = new faceapi.TinyFaceDetectorOptions({
        inputSize: 224,      // Tamanho reduzido da imagem processada (128, 160, 224 ou 320)
        scoreThreshold: 0.5  // Confiança mínima da detecção (50%)
      });

      // Loop executado a cada 200ms em vez de rodar a cada frame (evita congelar a tela)
      setInterval(async () => {
        const detections = await faceapi.detectAllFaces(video, detectorOptions)
                                         .withFaceLandmarks(true);

        const resizedDetections = faceapi.resizeResults(detections, displaySize);
        
        // Limpa a tela anterior e desenha as novas marcações
        const ctx = overlay.getContext('2d');
        ctx.clearRect(0, 0, overlay.width, overlay.height);
        faceapi.draw.drawDetections(overlay, resizedDetections);
        faceapi.draw.drawFaceLandmarks(overlay, resizedDetections);

      }, 200); // 200ms = 5 análises por segundo (desempenho fluido)
    }

    // Inicialização geral
    async function init() {
      try {
        await loadModels();
        await setupCamera();
        startDetection();
      } catch (err) {
        statusText.innerText = "Erro ao iniciar: " + err.message;
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
