<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Controle de Acesso Facial</title>

  <!-- Tags para comportamento de App em telas móveis -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">

  <!-- CSS FontAwesome para os Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Face-API.js via CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
    }

    /* Menu de Navegação */
    nav { 
      background-color: #1e1e1e; 
      width: 100%; 
      display: flex; 
      justify-content: space-around; 
      border-bottom: 1px solid #333; 
      position: sticky; 
      top: 0; 
      z-index: 100; 
    }

    nav button { 
      background: none; 
      border: none; 
      color: #aaa; 
      padding: 12px 6px; 
      font-size: 12px; 
      cursor: pointer; 
      transition: 0.3s; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      gap: 4px; 
      flex: 1;
    }

    nav button:hover, nav button.active { 
      color: #00ffcc; 
      border-bottom: 3px solid #00ffcc; 
    }

    /* Container Principal */
    .container { 
      width: 100%; 
      max-width: 600px; 
      padding: 15px; 
      margin: 0 auto; 
    }

    .tab-content { 
      display: none; 
      background: #1e1e1e; 
      padding: 20px; 
      border-radius: 12px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
      width: 100%;
    }

    .tab-content.active { 
      display: block; 
    }

    /* Ajuste de Vídeo */
    .video-container { 
      position: relative; 
      width: 100%; 
      aspect-ratio: 4 / 3; 
      border-radius: 8px; 
      overflow: hidden; 
      background: #000; 
      margin: 15px 0; 
    }

    video, canvas { 
      width: 100% !important; 
      height: 100% !important; 
      object-fit: cover;
      position: absolute; 
      top: 0; 
      left: 0; 
    }

    /* Formulários e Botões */
    .form-group { 
      margin-bottom: 15px; 
      text-align: left; 
    }

    label { 
      display: block; 
      margin-bottom: 5px; 
      color: #bbb; 
    }

    input[type="text"] { 
      width: 100%; 
      padding: 12px; 
      border-radius: 6px; 
      border: 1px solid #444; 
      background: #2a2a2a; 
      color: #fff; 
      font-size: 16px; 
    }

    button.btn-action { 
      background: #00ffcc; 
      color: #121212; 
      border: none; 
      padding: 14px 20px; 
      font-weight: bold; 
      border-radius: 6px; 
      cursor: pointer; 
      transition: 0.2s; 
      width: 100%; 
      font-size: 16px; 
      margin-top: 10px; 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    button.btn-action:hover { 
      background: #00d6a8; 
    }

    button.btn-action:disabled {
      background: #555;
      color: #aaa;
      cursor: not-allowed;
    }

    /* Tabela de Perfis */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-top: 15px; 
    }

    th, td { 
      padding: 12px 8px; 
      text-align: left; 
      border-bottom: 1px solid #333; 
      font-size: 14px;
    }

    th { 
      color: #00ffcc; 
    }

    .btn-delete { 
      background: none; 
      border: none; 
      color: #ff4d4d; 
      cursor: pointer; 
      font-size: 18px; 
      transition: 0.2s; 
    }

    .btn-delete:hover { 
      color: #ff0000; 
      transform: scale(1.2); 
    }

    /* Mensagens de Status */
    .status-box { 
      margin-top: 15px; 
      padding: 12px; 
      border-radius: 6px; 
      background: #2a2a2a; 
      text-align: center; 
      font-weight: bold; 
      font-size: 14px;
    }

    .status-success { 
      color: #00ffcc; 
      border: 1px solid #00ffcc; 
    }

    .status-danger { 
      color: #ff4d4d; 
      border: 1px solid #ff4d4d; 
    }
  </style>
</head>
<body>

  <!-- Menu de Navegação -->
  <nav>
    <button class="active" onclick="openTab('scan', event)"><i class="fa-solid fa-camera"></i> Escanear</button>
    <button onclick="openTab('cadastrar', event)"><i class="fa-solid fa-user-plus"></i> Cadastrar</button>
    <button onclick="openTab('gerenciar', event)"><i class="fa-solid fa-users-gear"></i> Perfis</button>
    <button onclick="openTab('config', event)"><i class="fa-solid fa-microchip"></i> ESP32</button>
  </nav>

  <div class="container">
    
    <!-- ABA 1: ESCANEAR ROSTO (MANUAL) -->
    <div id="scan" class="tab-content active">
      <h2 style="font-size: 18px;">Escanear Rosto</h2>
      <p style="color: #aaa; margin-bottom: 10px; font-size: 13px;">Posicione o rosto na câmera e toque no botão abaixo.</p>
      
      <div class="video-container">
        <video id="video-scan" autoplay muted playsinline></video>
        <canvas id="canvas-scan"></canvas>
      </div>

      <button id="btn-escanear" class="btn-action" onclick="escanearRostoManual()"><i class="fa-solid fa-expand"></i> Escanear Agora</button>
      <div id="status-scan" class="status-box">Aguardando posicionamento...</div>
    </div>

    <!-- ABA 2: CADASTRAR NOVO ROSTO -->
    <div id="cadastrar" class="tab-content">
      <h2 style="font-size: 18px;">Cadastrar Novo Perfil</h2>
      <p style="color: #aaa; margin-bottom: 10px; font-size: 13px;">Digite o nome e olhe para a câmera para registrar.</p>
      
      <div class="form-group">
        <label for="nome-usuario">Nome Completo:</label>
        <input type="text" id="nome-usuario" placeholder="Ex: João Silva">
      </div>
      
      <div class="video-container">
        <video id="video-cadastrar" autoplay muted playsinline></video>
      </div>
      
      <button class="btn-action" onclick="cadastrarRosto()"><i class="fa-solid fa-id-card"></i> Capturar e Salvar</button>
      <div id="status-cadastrar" class="status-box" style="display:none;"></div>
    </div>

    <!-- ABA 3: GERENCIAR PERFIS -->
    <div id="gerenciar" class="tab-content">
      <h2 style="font-size: 18px;">Perfis Cadastrados</h2>
      <p style="color: #aaa; margin-bottom: 10px; font-size: 13px;">Lista de pessoas autorizadas.</p>
      
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Data</th>
              <th style="width: 40px;">Ação</th>
            </tr>
          </thead>
          <tbody id="tabela-perfis">
            <!-- Linhas inseridas dinamicamente -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- ABA 4: CONFIGURAÇÃO DO ESP32 -->
    <div id="config" class="tab-content">
      <h2 style="font-size: 18px;">Comunicação ESP32</h2>
      <p style="color: #aaa; margin-bottom: 10px; font-size: 13px;">Insira o IP local do seu ESP32.</p>
      
      <div class="form-group">
        <label for="ip-esp32">Endereço IP do ESP32:</label>
        <input type="text" id="ip-esp32" placeholder="Ex: 192.168.1.50">
      </div>
      
      <button class="btn-action" onclick="salvarConfigESP()"><i class="fa-solid fa-floppy-disk"></i> Salvar IP</button>
      <div id="status-config" class="status-box" style="display:none;"></div>
    </div>

  </div>

  <script>
    let streamCamera = null;
    let perfisCadastrados = JSON.parse(localStorage.getItem('perfis_faciais')) || [];
    let ipESP32 = localStorage.getItem('ip_esp32') || '';
    let vozesDisponiveis = [];

    // Carregamento prévio e instantâneo das vozes do celular
    function carregarVozes() {
      if ('speechSynthesis' in window) {
        vozesDisponiveis = window.speechSynthesis.getVoices();
      }
    }
    carregarVozes();
    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = carregarVozes;
    }

    // Inicialização do App
    window.onload = async () => {
      document.getElementById('ip-esp32').value = ipESP32;
      await carregarModelosIA();
      await iniciarCamera('video-scan');
      atualizarTabelaPerfis();
    };

    // Alternar entre Abas
    function openTab(tabId, event) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      if (event) event.currentTarget.classList.add('active');

      if (tabId === 'scan') {
        iniciarCamera('video-scan');
      } else if (tabId === 'cadastrar') {
        iniciarCamera('video-cadastrar');
      }
    }

    // Carregamento dos modelos de IA via CDN
    async function carregarModelosIA() {
      const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
      try {
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);
      } catch (e) {
        console.error("Erro ao carregar modelos:", e);
      }
    }

    // Acesso à Câmera
    async function iniciarCamera(videoId) {
      if (streamCamera) {
        streamCamera.getTracks().forEach(track => track.stop());
      }
      const video = document.getElementById(videoId);
      try {
        streamCamera = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = streamCamera;
        return new Promise(resolve => video.onloadedmetadata = () => resolve());
      } catch (err) {
        alert("Erro ao acessar câmera: " + err.message);
      }
    }

    // Função de Voz sem Atrasos
    function falarBoasVindas(nome) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Cancela qualquer fala pendente imediatamente

        const mensagem = new SpeechSynthesisUtterance(`Bem-vindo, ${nome}`);
        mensagem.lang = 'pt-BR';
        mensagem.rate = 1.2; // Velocidade otimizada para resposta imediata

        if (vozesDisponiveis.length === 0) {
          vozesDisponiveis = window.speechSynthesis.getVoices();
        }

        // Prioriza a voz local do dispositivo
        const vozPt = vozesDisponiveis.find(v => v.lang.includes('pt') && v.localService) || 
                      vozesDisponiveis.find(v => v.lang.includes('pt'));
                      
        if (vozPt) mensagem.voice = vozPt;

        window.speechSynthesis.speak(mensagem);
      }
    }

    // ABA 1: Escaneamento Manual com Botão
    async function escanearRostoManual() {
      const video = document.getElementById('video-scan');
      const canvas = document.getElementById('canvas-scan');
      const statusBox = document.getElementById('status-scan');
      const btn = document.getElementById('btn-escanear');

      if (perfisCadastrados.length === 0) {
        statusBox.innerText = "Nenhum perfil cadastrado.";
        statusBox.className = "status-box status-danger";
        return;
      }

      btn.disabled = true;
      statusBox.innerText = "Analisando rosto...";
      statusBox.className = "status-box";

      const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
      const deteccoes = await faceapi.detectAllFaces(video, options).withFaceLandmarks(true).withFaceDescriptors();

      const displaySize = { width: video.clientWidth, height: video.clientHeight };
      faceapi.matchDimensions(canvas, displaySize);
      const resizedDeteccoes = faceapi.resizeResults(deteccoes, displaySize);

      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      faceapi.draw.drawDetections(canvas, resizedDeteccoes);

      if (deteccoes.length > 0) {
        const descriptorCapturado = deteccoes[0].descriptor;
        let autorizado = false;
        let nomeAutorizado = "";

        for (let perfil of perfisCadastrados) {
          const descriptorSalvo = new Float32Array(perfil.descriptor);
          const distancia = faceapi.euclideanDistance(descriptorCapturado, descriptorSalvo);
          
          if (distancia < 0.5) {
            autorizado = true;
            nomeAutorizado = perfil.nome;
            break;
          }
        }

        if (autorizado) {
          statusBox.innerText = `Acesso LIBERADO: ${nomeAutorizado}!`;
          statusBox.className = "status-box status-success";
          
          // 1. Fala IMEDIATAMENTE antes de realizar requisições de rede
          falarBoasVindas(nomeAutorizado);

          // 2. Envia a requisição de abertura ao ESP32
          enviarComandoESP32();
        } else {
          statusBox.innerText = "Rosto NÃO reconhecido!";
          statusBox.className = "status-box status-danger";
        }
      } else {
        statusBox.innerText = "Nenhum rosto detectado. Aproxime-se da câmera.";
        statusBox.className = "status-box status-danger";
      }

      btn.disabled = false;
    }

    // ABA 2: Cadastro de Rosto
    async function cadastrarRosto() {
      const nomeInput = document.getElementById('nome-usuario').value;
      const statusBox = document.getElementById('status-cadastrar');
      const video = document.getElementById('video-cadastrar');

      if (!nomeInput.trim()) {
        alert("Por favor, informe um nome.");
        return;
      }

      statusBox.style.display = "block";
      statusBox.innerText = "Analisando rosto...";
      statusBox.className = "status-box";

      const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
      const detec = await faceapi.detectSingleFace(video, options).withFaceLandmarks(true).withFaceDescriptor();

      if (detec) {
        const novoPerfil = {
          id: Date.now(),
          nome: nomeInput,
          data: new Date().toLocaleDateString('pt-BR'),
          descriptor: Array.from(detec.descriptor)
        };

        perfisCadastrados.push(novoPerfil);
        localStorage.setItem('perfis_faciais', JSON.stringify(perfisCadastrados));

        statusBox.innerText = `${nomeInput} cadastrado(a) com sucesso!`;
        statusBox.className = "status-box status-success";
        document.getElementById('nome-usuario').value = "";
        atualizarTabelaPerfis();
      } else {
        statusBox.innerText = "Rosto não detectado. Tente se aproximar.";
        statusBox.className = "status-box status-danger";
      }
    }

    // ABA 3: Atualização da Tabela de Perfis
    function atualizarTabelaPerfis() {
      const tbody = document.getElementById('tabela-perfis');
      tbody.innerHTML = "";

      if (perfisCadastrados.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#888;">Nenhum perfil.</td></tr>`;
        return;
      }

      perfisCadastrados.forEach(perfil => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${perfil.nome}</td>
          <td>${perfil.data}</td>
          <td>
            <button class="btn-delete" onclick="excluirPerfil(${perfil.id})" title="Excluir">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Exclusão de Perfil
    function excluirPerfil(id) {
      if (confirm("Remover o acesso desta pessoa?")) {
        perfisCadastrados = perfisCadastrados.filter(p => p.id !== id);
        localStorage.setItem('perfis_faciais', JSON.stringify(perfisCadastrados));
        atualizarTabelaPerfis();
      }
    }

    // ABA 4: Configuração do ESP32
    function salvarConfigESP() {
      const ip = document.getElementById('ip-esp32').value.trim();
      const statusBox = document.getElementById('status-config');

      ipESP32 = ip;
      localStorage.setItem('ip_esp32', ip);

      statusBox.style.display = "block";
      statusBox.innerText = "IP salvo com sucesso!";
      statusBox.className = "status-box status-success";
    }

    function enviarComandoESP32() {
      if (!ipESP32) return;
      fetch(`http://${ipESP32}/abrir`, { mode: 'no-cors' })
        .then(() => console.log("Comando enviado ao ESP32!"))
        .catch(err => console.error("Erro na requisição ao ESP32:", err));
    }
  </script>
</body>
</html>
