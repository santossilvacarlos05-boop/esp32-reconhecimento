<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle do Motor</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 50px; 
            background-color: #f4f4f9; 
        }
        .btn { 
            background-color: #28a745; 
            border: none; 
            color: white; 
            padding: 20px 40px; 
            font-size: 22px; 
            cursor: pointer; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:active { 
            background-color: #1e7e34; 
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <h1>Painel ESP32 - Motor</h1>
    <p>Clique no botão para ligar o motor por 2 segundos:</p>
    
    <!-- Envia a requisição para a rota do ESP32 -->
    <a href="/acionar"><button class="btn">LIGAR MOTOR (2s)</button></a>
</body>
</html>
